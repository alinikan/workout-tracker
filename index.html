<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the PWA use the full iPhone screen, including safe-area insets.
      interactive-widget=resizes-content helps mobile browsers resize when the keyboard opens.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="A 6-month body recomposition workout tracker with Gym Mode, exercise videos, logs, check-ins, and cloud sync."
    />
    <!-- Theme and Apple tags make the saved Home Screen version feel closer to a native app. -->
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Recomp Gym" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Recomp Gym Console" />
    <meta
      property="og:description"
      content="Track a 6-month body recomposition plan from your phone with a focused Gym Mode."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <!-- Icons and manifest power browser tabs, iPhone Home Screen install, and PWA launch. -->
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Recomp Gym Console</title>
  </head>
  <body>
    <!-- React renders the whole application inside this root element. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
