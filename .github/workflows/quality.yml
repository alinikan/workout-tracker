# No account secrets are needed: tests use local fixtures and mocked services.
name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # A floating runner label can change the browser's OS/dependency set between
    # identical commits. Keep Linux UI checks on this explicit LTS image.
    runs-on: ubuntu-24.04
    # Includes full-view axe contrast audits as well as repeated interaction tests.
    # Includes six additional trial-editor viewport/theme flows and two-device sync.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install isolated browser test engines
        # A stalled package mirror must not consume the entire test-job budget.
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium webkit
      - name: Phone and desktop UI checks
        # Run every viewport/theme twice in fresh contexts. No automatic retry
        # may turn a missed tap into a pass; each interaction must work first time.
        run: npm run test:ui -- --repeat=2
      - name: Keep UI screenshots and traces when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-screenshots
          path: outputs/ui-check
          if-no-files-found: ignore
      - run: npm audit --audit-level=high
