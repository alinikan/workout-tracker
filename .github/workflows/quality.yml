# No account secrets are needed: tests use local fixtures and mocked services.
name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install isolated browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Phone and desktop UI checks
        run: npm run test:ui
      - name: Keep UI screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-screenshots
          path: outputs/ui-check
          if-no-files-found: ignore
      - run: npm audit --audit-level=high
